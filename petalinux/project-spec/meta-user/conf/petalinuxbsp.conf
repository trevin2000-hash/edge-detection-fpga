#User Configuration

#OE_TERMINAL = "tmux"



# machine-specific download and sstate cache paths, not committed
include conf/local-cache.conf
IMAGE_BOOT_FILES:zynqmp = "BOOT.BIN boot.scr image.ub"
EXTRA_IMAGE_FEATURES += "tools-sdk tools-debug"

# meta-avnet's machine file hard-assigns MACHINE_FEATURES, which drops the
# fpga-overlay feature PetaLinux adds for FPGA Manager. :append is applied last.
MACHINE_FEATURES:append = " fpga-overlay"
